# .github/workflows/ci.yml
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"

jobs:
  sanity:
    name: Sanity (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible:
          - stable-2.16
          - stable-2.17
          - stable-2.18
          - stable-2.19
          - stable-2.20
          - devel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ansible_collections/xianganwu/stormagic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core (${{ matrix.ansible }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz

      - name: Run sanity tests
        run: ansible-test sanity --docker -v --color
        working-directory: ansible_collections/xianganwu/stormagic

  units:
    name: Unit Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ansible_collections/xianganwu/stormagic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Run unit tests
        run: ansible-test units --docker -v --color --coverage --python ${{ matrix.python }}
        working-directory: ansible_collections/xianganwu/stormagic

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: units
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ansible_collections/xianganwu/stormagic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ansible-core pytest

      - name: Run integration tests
        run: PYTHONPATH=${{ github.workspace }} pytest tests/integration/test_svkms_live.py -v
        working-directory: ansible_collections/xianganwu/stormagic

  build:
    name: Collection Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ansible-core galaxy-importer

      - name: Build collection
        run: ansible-galaxy collection build --force

      - name: Validate with galaxy-importer
        run: python -m galaxy_importer.main xianganwu-stormagic-*.tar.gz

  certification:
    name: Partner Certification Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ansible_collections/xianganwu/stormagic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ansible-core galaxy-importer ansible-lint antsibull-changelog

      - name: Build collection
        run: ansible-galaxy collection build --force
        working-directory: ansible_collections/xianganwu/stormagic

      - name: Run galaxy-importer certification
        run: python -m galaxy_importer.main ansible_collections/xianganwu/stormagic/xianganwu-stormagic-*.tar.gz

      - name: Run ansible-lint (production profile)
        run: ansible-lint --strict --profile production
        working-directory: ansible_collections/xianganwu/stormagic

      - name: Validate changelog
        run: antsibull-changelog lint
        working-directory: ansible_collections/xianganwu/stormagic

      - name: Validate module documentation
        run: |
          pip install https://github.com/ansible/ansible/archive/stable-2.17.tar.gz
          ansible-test sanity --test validate-modules -v --color
        working-directory: ansible_collections/xianganwu/stormagic

  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Run ansible-lint
        run: ansible-lint --strict --profile production

  pester:
    name: Pester Tests (SvSAN PowerShell)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        run: pwsh -Command "Install-Module -Name Pester -RequiredVersion 5.6.1 -Force -Scope CurrentUser"

      - name: Run Pester tests
        run: bash tests/pester/run_pester.sh

  playbook-validation:
    name: Playbook Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ansible_collections/xianganwu/stormagic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ansible-core pytest
          ansible-galaxy collection install vmware.vmware -p ${{ github.workspace }}

      - name: Run playbook syntax checks
        run: ANSIBLE_COLLECTIONS_PATH=${{ github.workspace }} pytest tests/test_playbook_syntax.py -v
        working-directory: ansible_collections/xianganwu/stormagic
