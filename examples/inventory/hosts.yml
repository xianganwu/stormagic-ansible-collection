---
# StorMagic Collection — Example Inventory
#
# Replace placeholder values with your environment details.
# Store credentials in vault.yml (see group_vars/all/vault.yml).

all:
  children:
    # ── SvKMS Servers ──────────────────────────────────────────────
    # SvKMS modules run on the Ansible controller via REST API.
    # ansible_connection: local ensures modules execute locally and
    # reach the KMS server through the host parameter (port 1443).
    svkms_servers:
      vars:
        ansible_connection: local
      hosts:
        svkms1:
          svkms_host: svkms1.example.com
        # svkms2:
        #   svkms_host: svkms2.example.com

    # ── Windows Management Host ────────────────────────────────────
    # SvSAN modules delegate to this host (requires PowerShell Toolkit).
    # WinRM must be enabled — see docs/svsan_quickstart.md for setup.
    windows_mgmt:
      hosts:
        win-mgmt:
          ansible_host: win-mgmt.example.com
          ansible_connection: winrm
          ansible_winrm_transport: ntlm
          ansible_user: "{{ vault_windows_username }}"
          ansible_password: "{{ vault_windows_password }}"
          # For production, use HTTPS:
          # ansible_port: 5986
          # ansible_winrm_server_cert_validation: validate
          # For dev/test only:
          ansible_port: 5985
          ansible_winrm_server_cert_validation: ignore

    # ── SvSAN VSAs ─────────────────────────────────────────────────
    # Virtual Storage Appliances managed via the Windows host above.
    svsan_vsas:
      hosts:
        vsa1:
          svsan_vsa_hostname: vsa1.example.com
        vsa2:
          svsan_vsa_hostname: vsa2.example.com

    # ── ESXi Hosts (for patching workflow) ─────────────────────────
    # Map each ESXi host to its paired SvSAN VSA via svsan_vsa host_var.
    esxi_hosts:
      hosts:
        esxi1:
          ansible_host: esxi1.example.com
          svsan_vsa: vsa1.example.com
        esxi2:
          ansible_host: esxi2.example.com
          svsan_vsa: vsa2.example.com
      vars:
        ansible_connection: ssh
        ansible_user: root
        vcenter_hostname: vcenter.example.com
        vcenter_username: "{{ vault_vcenter_username }}"
        vcenter_password: "{{ vault_vcenter_password }}"

  # ── Shared vCenter/deploy vars (used by svsan_ha_setup) ────────
  vars:
    vcenter_hostname: vcenter.example.com
    vcenter_datacenter: Datacenter1
    vcenter_cluster: Cluster1
    vcenter_datastore: datastore1
    svsan_ha_nodes:
      - hostname: svsan-vsa-01
        ip_address: 192.168.1.101
        node_id: 1
      - hostname: svsan-vsa-02
        ip_address: 192.168.1.102
        node_id: 2
