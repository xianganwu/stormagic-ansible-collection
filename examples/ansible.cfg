[defaults]
# Increase parallelism for multi-host operations
forks = 20

# Default inventory path
inventory = ./inventory/hosts.yml

# Use YAML stdout for readability
stdout_callback = yaml

# Disable .retry files
retry_files_enabled = false

[connection]
# Enable pipelining for better SSH performance
pipelining = true

[persistent_connection]
# WinRM/PSRP timeout for SvSAN PowerShell operations
command_timeout = 120
connect_timeout = 60
