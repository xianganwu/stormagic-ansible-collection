---
ancestor: null
releases:
  1.0.0:
    release_date: "2026-04-29"
    changes:
      release_summary: >-
        Initial release of the StorMagic Ansible collection for managing
        SvKMS encryption key management and SvSAN virtual storage appliances.
      major_changes:
        - SvKMS httpapi plugin for REST API connectivity.
        - Seven SvKMS modules for key, user, policy, certificate, health check,
          and backup/restore management.
        - Eleven SvSAN PowerShell modules for target, pool, mirror, config,
          license, health check, and VSA deployment management.
        - Four roles for SvKMS setup, SvSAN deployment, and patching workflows.
    modules:
      - name: svkms_key
        description: Manage encryption keys on SvKMS
        namespace: ""
      - name: svkms_key_info
        description: Gather key information from SvKMS
        namespace: ""
      - name: svkms_health_check
        description: Check SvKMS server health
        namespace: ""
      - name: svkms_certificate
        description: Manage certificates on SvKMS
        namespace: ""
      - name: svkms_user
        description: Manage users on SvKMS
        namespace: ""
      - name: svkms_policy
        description: Manage key access policies on SvKMS
        namespace: ""
      - name: svkms_backup
        description: Backup and restore SvKMS
        namespace: ""
      - name: svsan_health_check
        description: Run health checks on SvSAN VSA
        namespace: ""
      - name: svsan_target
        description: Manage iSCSI targets on SvSAN
        namespace: ""
      - name: svsan_target_info
        description: Gather target info from SvSAN
        namespace: ""
      - name: svsan_mirror
        description: Manage mirrored storage on SvSAN
        namespace: ""
      - name: svsan_mirror_info
        description: Gather mirror status from SvSAN
        namespace: ""
      - name: svsan_pool
        description: Manage storage pools on SvSAN
        namespace: ""
      - name: svsan_pool_info
        description: Gather pool info from SvSAN
        namespace: ""
      - name: svsan_license
        description: Manage SvSAN licenses
        namespace: ""
      - name: svsan_config
        description: Manage VSA configuration
        namespace: ""
      - name: svsan_config_info
        description: Gather VSA configuration
        namespace: ""
      - name: svsan_vsa
        description: Deploy VSA instances
        namespace: ""
    plugins:
      httpapi:
        - name: svkms
          description: HttpApi plugin for SvKMS REST API
          namespace: null
  1.0.1:
    release_date: "2026-04-29"
    changes:
      release_summary: >-
        Namespace correction for Ansible Galaxy publishing.
      bugfixes:
        - Changed collection namespace from ``stormagic`` to ``xianganwu`` for
          Ansible Galaxy compatibility.
  1.0.2:
    release_date: "2026-04-29"
    changes:
      release_summary: >-
        Bug fixes and quality-of-life improvements for SvKMS and SvSAN modules.
      bugfixes:
        - Fixed broken ``#AnsibleRequires`` namespace in all SvSAN PowerShell modules
          (``stormagic.stormagic`` to ``xianganwu.stormagic``).
        - Fixed namespace references in README, quickstart guides, and patching
          workflow docs.
      minor_changes:
        - Added ``validate_certs`` and ``ca_path`` parameters to all SvKMS modules
          for TLS certificate validation control.
        - Added automatic retry with exponential backoff to SvKMS API client (retries
          on 5xx, 429, and connection errors; no retry on 4xx client errors).
        - Added retry with exponential backoff to SvSAN ``Connect-SmVsa`` helper.
        - Improved error messages in all modules.
        - Added diff mode support (``--diff``) to all state-changing SvKMS and SvSAN
          modules for before/after change visibility.
  1.0.3:
    release_date: "2026-04-29"
    changes:
      release_summary: >-
        Migrated VMware dependency from community collection to Red Hat certified
        collection.
      breaking_changes:
        - Replaced ``community.vmware`` dependency with ``vmware.vmware`` (>= 2.0.0),
          the Red Hat certified VMware collection.
        - The ``svsan_deploy`` role now uses a multi-step workflow with
          ``vmware.vmware.deploy_folder_template``, ``vmware.vmware.vm``,
          ``vmware.vmware.vm_apply_customization``, and ``vmware.vmware.vm_powerstate``
          instead of a single ``community.vmware.vmware_guest`` call.
        - New role variables required for guest customization -
          ``svsan_deploy_domain``, ``svsan_deploy_netmask``, ``svsan_deploy_gateway``,
          ``svsan_deploy_dns_servers``.
        - ESXi maintenance mode in patching workflow now uses
          ``vmware.vmware.esxi_maintenance_mode`` which connects through vCenter.
  1.1.0:
    release_date: "2026-04-29"
    changes:
      release_summary: >-
        Certification readiness improvements and new end-user features.
      minor_changes:
        - Added ``action_groups`` to ``meta/runtime.yml`` for ``module_defaults``
          grouping.
        - Expanded RETURN documentation with ``contains:`` nesting for all SvKMS
          modules.
        - Added 2-3 examples per module covering check mode and register+assert
          patterns.
        - Added ``argument_specs.yml`` for all roles enabling ``ansible-doc --type
          role`` rendering.
        - Added ``meta/execution-environment.yml`` for Ansible Automation Platform
          EE builds.
        - Added partner-certification-checker job to CI workflow.
        - Improved README with dependency table, Red Hat certified support language,
          and full URLs.
    objects:
      role:
        - name: svkms_key_rotation
          description: Rotate encryption keys on SvKMS
          namespace: null
  1.1.1:
    release_date: "2026-04-29"
    changes:
      release_summary: >-
        Bug fixes, security hardening, and CI/testing improvements.
      bugfixes:
        - >-
          Fixed ``svsan_deploy`` role passing invalid ``node_id`` parameter to
          ``svsan_vsa`` module and invalid ``size_gb`` parameter to ``svsan_pool``
          module.
        - >-
          Fixed ``svsan_ha_setup`` playbook using non-existent ``mirror_enabled``
          and ``mirror_node`` parameters on ``svsan_target`` module.
        - >-
          Fixed ``svkms_health_check`` module not failing when API returns
          unhealthy status (only failed on connection errors).
        - Fixed copyright year inconsistency in SvKMS doc fragment.
        - Added missing v1.0.1 entry to changelog.
      minor_changes:
        - >-
          Added ``no_log: true`` to ``vsa_password`` in SvSAN doc fragment
          to prevent credential leakage in verbose output.
        - Added sanity ignore files for ansible-core 2.18, 2.19, and 2.20.
        - Expanded CI sanity test matrix to include ansible-core 2.18 through 2.20.
        - >-
          Added Molecule test scaffolding for ``svkms_key_rotation`` and
          ``svsan_deploy`` roles.
        - Removed unused ``module_utils/common.py`` dead code.
  1.1.2:
    release_date: "2026-04-29"
    changes:
      release_summary: >-
        Fix sanity test and ansible-lint failures across all ansible-core versions.
      bugfixes:
        - >-
          Added ``host`` and ``port`` to argument_spec in all SvKMS modules to
          match the doc fragment DOCUMENTATION, fixing ``nonexistent-parameter-documented``
          sanity errors.
        - >-
          Removed ``no_log: true`` from ``vsa_password`` in the SvSAN doc fragment
          DOCUMENTATION block — ``no_log`` is only valid in argument_spec (already
          present in the PowerShell modules), not in YAML documentation.
        - >-
          Added missing ``datacenter`` parameter to ``vmware.vmware.vm_powerstate``
          task in ``svsan_deploy`` role, fixing ansible-lint ``args[module]`` warning.
      minor_changes:
        - Added EXAMPLES block to SvKMS httpapi plugin.
        - Added copyright header to ``module_utils/svkms_api.py``.
  1.1.3:
    release_date: "2026-04-29"
    changes:
      release_summary: >-
        Make SvKMS host parameter optional for httpapi connection compatibility.
      bugfixes:
        - >-
          Changed ``host`` from required to optional in all SvKMS module
          argument_specs. When using httpapi connection, host is provided by
          inventory; modules now fail with a clear message if host is missing
          outside httpapi context. Fixes ansible-lint args[module] warnings in
          roles and playbooks.
  1.2.0:
    release_date: "2026-04-29"
    changes:
      release_summary: >-
        Sheetz-informed patching workflow improvements. New ESXi preflight
        module, mirror resync wait, health baseline comparison, and
        production-ready patching playbook.
      minor_changes:
        - >-
          Added ``svsan_esxi_preflight`` module for pre-patching ESXi checks
          via vCenter — retrieves active alerts, build number, version, and
          maintenance mode status using PowerCLI.
        - >-
          Added mirror resync polling to ``svsan_patching_postflight`` role —
          waits for mirrors to resynchronize after ESXi reboot before running
          health checks (configurable retries/delay).
        - >-
          Added ``set_fact`` output variables to both patching roles:
          ``svsan_patching_preflight_status``,
          ``svsan_patching_preflight_baseline``, and
          ``svsan_patching_postflight_status`` for workflow conditional logic.
        - >-
          Added pre/post health comparison to ``svsan_patching_postflight``
          role — detects health degradation by comparing against preflight
          baseline.
        - >-
          Integrated optional ESXi preflight checks into
          ``svsan_patching_preflight`` role via
          ``svsan_patching_preflight_check_esxi`` toggle (default false).
        - >-
          Rewrote ``svsan_patching_workflow.yml`` playbook with complete
          ESXi patching workflow including ``serial`` batching, maintenance
          mode via ``vmware.vmware.esxi_maintenance_mode``, and pre/post
          health gates.
        - >-
          Rewrote ``docs/patching_workflow.md`` with correct variable names,
          per-vCenter scale guidance, and WinRM concurrency tuning.
        - >-
          Added ``pyvmomi>=8.0.0`` to EE requirements for
          ``vmware.vmware`` dependency compatibility.
        - >-
          Added Molecule test scaffolding for ``svsan_patching_preflight``
          and ``svsan_patching_postflight`` roles.
    modules:
      - name: svsan_esxi_preflight
        description: Pre-patching checks for ESXi hosts via vCenter
        namespace: ""
  1.2.5:
    release_date: "2026-04-29"
    changes:
      release_summary: >-
        Certification and best-practices audit fixes. Removes dead httpapi
        plugin, adds direct API key authentication, fixes session leaks,
        improves idempotency, and cleans up unused parameters.
      breaking_changes:
        - >-
          Removed the ``svkms`` httpapi connection plugin. All SvKMS modules
          now connect directly to the REST API using ``host`` and ``api_key``
          (or ``username``/``password``) parameters. Playbooks using
          ``connection: ansible.netcommon.httpapi`` must be updated.
      bugfixes:
        - >-
          Fixed session leak in all 11 SvSAN PowerShell modules — sessions
          are now properly disconnected via ``try/finally`` blocks.
        - >-
          Fixed session leak in ``svsan_esxi_preflight`` — ``Disconnect-VIServer``
          moved from ``try`` to ``finally`` block.
        - >-
          Fixed ``svkms_user`` idempotency — module now compares ``role`` and
          ``auth_type`` against existing user and calls ``update_user`` when
          different instead of silently skipping.
        - >-
          Fixed ``svkms_policy`` idempotency — module now compares ``rules``
          against existing policy and calls ``update_policy`` when different.
        - >-
          Fixed ``svkms_certificate`` substring matching — ``find_certificate_by_name``
          now uses exact match on ``name`` field with CN extraction fallback
          instead of substring search on ``subject``.
        - >-
          Fixed ``svsan_license`` idempotency — module now compares license
          state before and after applying, correctly reporting ``changed``
          only when the license actually changed. Check mode runs before
          any mutation.
        - >-
          Fixed ``svsan_vsa`` idempotency — module now checks for existing
          VSA by name via ``Get-SmVcVSA`` before deploying, returning
          ``changed: false`` if already deployed.
        - >-
          Fixed ``svkms_key`` not passing ``metadata`` parameter to
          ``create_key`` API call.
        - >-
          Fixed credential leak — ``SvKMSClient`` now clears the password
          from memory after successful login.
        - >-
          Removed non-functional ``state: absent`` from ``svsan_vsa`` and
          ``svkms_certificate`` modules (API does not support deletion).
        - >-
          Removed unused ``mirror`` parameter from ``svsan_target`` module
          (mirroring is managed via ``svsan_mirror``).
        - >-
          Removed unused ``cert_type`` parameter from ``svkms_certificate``
          module and roles.
        - >-
          Fixed ``svsan_health_check`` check mode — no longer calls
          ``FailJson`` when health status is ``fail`` during check mode.
      minor_changes:
        - >-
          Added ``api_key``, ``username``, and ``password`` authentication
          parameters to all SvKMS modules for direct REST API connection.
        - >-
          Added ``client.login()``/``client.logout()`` session lifecycle to
          all SvKMS modules, enabling username/password authentication and
          proper session cleanup via ``try/finally`` blocks.
        - >-
          Added ``Disconnect-SmSession`` function to ``SvSAN.psm1`` module
          utility and ``Remove-SmSession`` mock for Pester testing.
        - >-
          Added ``update_user`` and ``update_policy`` methods to
          ``SvKMSClient`` for proper idempotent updates.
        - >-
          Added tags to patching roles and workflow playbook for selective
          task execution (``svsan_preflight``, ``svsan_postflight``,
          ``svsan_maintenance``, ``svsan_patch``, ``svsan_reboot``).
        - >-
          Cleaned unused variables from ``svkms_setup`` role defaults and
          argument_specs (``svkms_setup_admin_password``,
          ``svkms_setup_admin_email``, ``svkms_setup_ca_organization``,
          ``svkms_setup_ca_validity_days``).
        - >-
          Removed empty-string defaults for required ``host`` and ``api_key``
          parameters from ``svkms_key_rotation`` and ``svkms_setup`` role
          defaults — these are validated via ``argument_specs`` as required.
        - >-
          Added ``host`` and ``api_key`` test values to ``svkms_key_rotation``
          molecule converge for proper CI validation.
        - >-
          Added ``Get-SmVcVSA`` function to SvSAN mock for VSA existence
          checks in Pester tests.
  1.2.6:
    release_date: "2026-04-30"
    changes:
      release_summary: >-
        Comprehensive audit fixes for Red Hat certification readiness.
        Fixes critical authentication bug, diff-mode consistency, documentation
        accuracy, and role configuration correctness.
      bugfixes:
        - >-
          Fixed ``svkms_user`` missing ``username`` parameter in SvKMSClient
          initialization — username/password authentication was completely
          broken for this module.
        - >-
          Fixed ``svkms_certificate`` silent exception swallowing during
          cert_id lookup — now only catches 404 (not found) and re-raises
          other API errors (auth failures, server errors).
        - >-
          Fixed ``svkms_backup`` check mode results missing ``status`` field
          documented in RETURN section.
        - >-
          Fixed ``svsan_pool`` incorrect ``Diff.before`` when deleting — was
          set to empty hash instead of the existing pool state.
        - >-
          Fixed diff-mode output in ``svsan_target``, ``svsan_mirror``,
          ``svsan_pool``, and ``svsan_config`` — now set ``Diff.before`` and
          ``Diff.after`` in all idempotent (no-change) paths for consistent
          ``--diff`` output.
        - >-
          Fixed ``svkms_setup`` role default policies using invalid
          ``rotation_days``/``key_algorithm`` fields — replaced with correct
          ``rules`` format accepted by ``svkms_policy`` module.
        - >-
          Fixed ``README.md`` role example using wrong variable names
          (``svsan_vsa_hostname`` instead of
          ``svsan_patching_preflight_vsa_hostname``).
        - >-
          Fixed ``docs/svkms_quickstart.md`` using invalid algorithm value
          ``AES256`` — corrected to ``algorithm: AES`` with ``length: 256``.
      minor_changes:
        - >-
          Added copyright header to ``svsan.py`` doc fragment for Red Hat
          certification compliance.
        - >-
          Added ``.DS_Store`` and ``.pytest_cache`` to ``galaxy.yml``
          build_ignore to prevent build artifacts from entering the
          collection tarball.
