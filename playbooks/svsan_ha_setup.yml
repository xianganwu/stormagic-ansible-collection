---
- name: Deploy StorMagic SvSAN HA Cluster
  hosts: localhost
  gather_facts: false
  vars:
    vcenter_hostname: "vcenter.example.com"
    vcenter_username: "administrator@vsphere.local"
    vcenter_password: "{{ vault_vcenter_password }}"
    vcenter_datacenter: "Datacenter1"
    vcenter_cluster: "Cluster1"

    vsa_datastore: "datastore1"
    vsa_admin_password: "{{ vault_vsa_admin_password }}"

    vsa_nodes:
      - hostname: "svsan-vsa-01"
        ip_address: "192.168.1.101"
        node_id: 1
      - hostname: "svsan-vsa-02"
        ip_address: "192.168.1.102"
        node_id: 2

    windows_mgmt_host: "win-mgmt.example.com"

  tasks:
    - name: Deploy VSA cluster
      ansible.builtin.include_role:
        name: stormagic.stormagic.svsan_deploy

    - name: Create mirrored storage targets
      stormagic.stormagic.svsan_target:
        vsa_hostname: "{{ vsa_nodes[0].ip_address }}"
        vsa_username: "admin"
        vsa_password: "{{ vsa_admin_password }}"
        name: "ha-target-{{ item }}"
        size_gb: 50
        mirror_enabled: true
        mirror_node: "{{ vsa_nodes[1].ip_address }}"
        state: present
      loop:
        - 1
        - 2
        - 3
      delegate_to: "{{ windows_mgmt_host }}"

    - name: Verify cluster health
      stormagic.stormagic.svsan_health_check:
        vsa_hostname: "{{ vsa_nodes[0].ip_address }}"
        vsa_username: "admin"
        vsa_password: "{{ vsa_admin_password }}"
        checks:
          - connectivity
          - license
          - targets
          - mirrors
          - pools
      delegate_to: "{{ windows_mgmt_host }}"
      register: health_result

    - name: Display cluster status
      ansible.builtin.debug:
        msg: "SvSAN HA cluster deployed successfully. Health: {{ health_result.health.overall }}"
