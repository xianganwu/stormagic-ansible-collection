---
- name: Deploy StorMagic SvSAN HA Cluster
  hosts: localhost
  gather_facts: false
  vars:
    svsan_deploy_vcenter_hostname: "vcenter.example.com"
    svsan_deploy_vcenter_username: "administrator@vsphere.local"
    svsan_deploy_vcenter_password: "{{ vault_vcenter_password }}"
    svsan_deploy_vcenter_datacenter: "Datacenter1"
    svsan_deploy_vcenter_cluster: "Cluster1"

    svsan_deploy_datastore: "datastore1"
    svsan_deploy_admin_password: "{{ vault_vsa_admin_password }}"

    svsan_deploy_nodes:
      - hostname: "svsan-vsa-01"
        ip_address: "192.168.1.101"
        node_id: 1
      - hostname: "svsan-vsa-02"
        ip_address: "192.168.1.102"
        node_id: 2

    windows_mgmt_host: "win-mgmt.example.com"

  tasks:
    - name: Deploy VSA cluster
      ansible.builtin.include_role:
        name: xianganwu.stormagic.svsan_deploy

    - name: Create storage targets
      xianganwu.stormagic.svsan_target:
        vsa_hostname: "{{ svsan_deploy_nodes[0].ip_address }}"
        vsa_username: "admin"
        vsa_password: "{{ svsan_deploy_admin_password }}"
        name: "ha-target-{{ item }}"
        size_gb: 50
        mirror: true
        state: present
      loop:
        - 1
        - 2
        - 3
      delegate_to: "{{ windows_mgmt_host }}"

    - name: Configure mirrors to secondary node
      xianganwu.stormagic.svsan_mirror:
        vsa_hostname: "{{ svsan_deploy_nodes[0].ip_address }}"
        vsa_username: "admin"
        vsa_password: "{{ svsan_deploy_admin_password }}"
        name: "ha-target-{{ item }}"
        remote_vsa: "{{ svsan_deploy_nodes[1].ip_address }}"
        state: present
      loop:
        - 1
        - 2
        - 3
      delegate_to: "{{ windows_mgmt_host }}"

    - name: Verify cluster health
      xianganwu.stormagic.svsan_health_check:
        vsa_hostname: "{{ svsan_deploy_nodes[0].ip_address }}"
        vsa_username: "admin"
        vsa_password: "{{ svsan_deploy_admin_password }}"
        checks:
          - connectivity
          - license
          - targets
          - mirrors
          - pools
      delegate_to: "{{ windows_mgmt_host }}"
      register: health_result

    - name: Display cluster status
      ansible.builtin.debug:
        msg: "SvSAN HA cluster deployed successfully. Health: {{ health_result.health.overall }}"
