---
# SvSAN HA Cluster Setup
#
# Deploys a 2-node SvSAN VSA cluster, creates storage targets with
# mirrors, and verifies cluster health.
#
# Required inventory/vault variables:
#   svsan_ha_nodes          - list of node dicts with name, ip_address, etc.
#   vcenter_hostname        - vCenter server hostname
#   vcenter_datacenter      - vCenter datacenter name
#   vcenter_cluster         - vCenter cluster name
#   vcenter_datastore       - vCenter datastore for VSA VMs
#   vault_vsa_username      - VSA admin username (from vault)
#   vault_vsa_password      - VSA admin password (from vault)
#   vault_vcenter_username  - vCenter username (from vault)
#   vault_vcenter_password  - vCenter password (from vault)
#
# Optional:
#   svsan_deploy_pool_name  - storage pool name (default: 'default-pool')
#   svsan_windows_mgmt_host - Windows host for delegation
#                             (default: first host in windows_mgmt group)
#
# Usage:
#   ansible-playbook playbooks/svsan_ha_setup.yml \
#     -i inventory/hosts.yml --ask-vault-pass
#
- name: Deploy StorMagic SvSAN HA Cluster
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/xianganwu.stormagic.svsan:
      vsa_hostname: "{{ svsan_deploy_nodes[0].ip_address }}"
      vsa_username: "{{ svsan_vsa_username }}"
      vsa_password: "{{ svsan_vsa_password }}"

  vars:
    svsan_vsa_username: "{{ vault_vsa_username }}"
    svsan_vsa_password: "{{ vault_vsa_password }}"
    vcenter_username: "{{ vault_vcenter_username }}"
    vcenter_password: "{{ vault_vcenter_password }}"
    svsan_deploy_vcenter_hostname: "{{ vcenter_hostname }}"
    svsan_deploy_vcenter_username: "{{ vcenter_username }}"
    svsan_deploy_vcenter_password: "{{ vcenter_password }}"
    svsan_deploy_vcenter_datacenter: "{{ vcenter_datacenter }}"
    svsan_deploy_vcenter_cluster: "{{ vcenter_cluster }}"
    svsan_deploy_datastore: "{{ vcenter_datastore }}"
    svsan_deploy_admin_password: "{{ svsan_vsa_password }}"
    svsan_deploy_nodes: "{{ svsan_ha_nodes }}"
    svsan_ha_pool: "{{ svsan_deploy_pool_name | default('default-pool') }}"
    svsan_ha_targets:
      - name: ha-target-1
        size_gb: 50
      - name: ha-target-2
        size_gb: 50
      - name: ha-target-3
        size_gb: 50
    windows_mgmt_host: "{{ svsan_windows_mgmt_host | default(groups['windows_mgmt'][0]) }}"

  tasks:
    - name: Deploy VSA cluster
      tags: [svsan_deploy]
      ansible.builtin.include_role:
        name: xianganwu.stormagic.svsan_deploy

    - name: Create targets and mirrors
      tags: [svsan_targets, svsan_mirrors]
      block:
        - name: Create storage targets
          tags: [svsan_targets]
          xianganwu.stormagic.svsan_target:
            name: "{{ item.name }}"
            size_gb: "{{ item.size_gb }}"
            pool: "{{ svsan_ha_pool }}"
            state: present
          loop: "{{ svsan_ha_targets }}"
          delegate_to: "{{ windows_mgmt_host }}"

        - name: Mirror targets to secondary node
          tags: [svsan_mirrors]
          xianganwu.stormagic.svsan_mirror:
            name: "{{ item.name }}"
            remote_vsa: "{{ svsan_deploy_nodes[1].ip_address }}"
            remote_pool: "{{ svsan_ha_pool }}"
            state: present
          loop: "{{ svsan_ha_targets }}"
          delegate_to: "{{ windows_mgmt_host }}"

      rescue:
        - name: Storage setup failed
          ansible.builtin.fail:
            msg: >-
              Storage setup failed: {{ ansible_failed_result.msg | default('unknown error') }}.
              Some targets may have been created without mirrors.
              Check cluster state and retry with: --tags svsan_targets,svsan_mirrors

    - name: Verify cluster health
      tags: [svsan_verify]
      xianganwu.stormagic.svsan_health_check:
        checks:
          - connectivity
          - license
          - targets
          - mirrors
          - pools
      delegate_to: "{{ windows_mgmt_host }}"
      register: health_result

    - name: Display cluster status
      tags: [svsan_verify]
      ansible.builtin.debug:
        msg: >-
          SvSAN HA cluster deployed.
          Health: {{ health_result.health.overall }}.
          Targets: {{ svsan_ha_targets | length }}.
