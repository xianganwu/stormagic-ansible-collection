---
# ESXi Patching Workflow with SvSAN Health Gates
#
# Patches ESXi hosts in batches with pre/post StorMagic VSA health validation.
# Supports optional vCenter alert checking and ESXi build number verification.
#
# Required inventory groups:
#   - esxi_hosts: ESXi hosts to patch (with svsan_vsa host_var)
#   - windows_mgmt: Windows management host with StorMagic PowerShell Toolkit
#
# Usage:
#   ansible-playbook playbooks/svsan_patching_workflow.yml \
#     -i inventory/hosts.yml --ask-vault-pass \
#     -e svsan_patching_batch_size=10
#
- name: StorMagic SvSAN Patching Workflow
  hosts: esxi_hosts
  gather_facts: false
  serial: "{{ svsan_patching_batch_size | default(10) }}"
  max_fail_percentage: 0
  module_defaults:
    vmware.vmware.esxi_maintenance_mode:
      hostname: "{{ svsan_patching_vcenter_hostname }}"
      username: "{{ svsan_patching_vcenter_username }}"
      password: "{{ svsan_patching_vcenter_password }}"
      validate_certs: "{{ svsan_patching_validate_certs }}"

  vars:
    svsan_patching_vcenter_hostname: "{{ vcenter_hostname }}"
    svsan_patching_vcenter_username: "{{ vcenter_username }}"
    svsan_patching_vcenter_password: "{{ vcenter_password }}"
    svsan_patching_vsa_username: "{{ vault_vsa_username }}"
    svsan_patching_vsa_password: "{{ vault_vsa_password }}"
    svsan_patching_windows_mgmt_host: "{{ groups['windows_mgmt'][0] }}"
    svsan_patching_patch_depot: "/vmfs/volumes/datastore1/patches/depot.zip"
    svsan_patching_check_esxi: false
    svsan_patching_validate_certs: true

  tasks:
    # ── Phase 1: Pre-Patching Health Gate ─────────────────────────
    - name: Pre-flight checks
      tags: [svsan_preflight]
      ansible.builtin.include_role:
        name: xianganwu.stormagic.svsan_patching_preflight
      vars:
        svsan_patching_preflight_vsa_hostname: "{{ hostvars[inventory_hostname].svsan_vsa }}"
        svsan_patching_preflight_vsa_username: "{{ svsan_patching_vsa_username }}"
        svsan_patching_preflight_vsa_password: "{{ svsan_patching_vsa_password }}"
        svsan_patching_preflight_windows_mgmt_host: "{{ svsan_patching_windows_mgmt_host }}"
        svsan_patching_preflight_check_esxi: "{{ svsan_patching_check_esxi }}"
        svsan_patching_preflight_vcenter_hostname: "{{ svsan_patching_vcenter_hostname }}"
        svsan_patching_preflight_vcenter_username: "{{ svsan_patching_vcenter_username }}"
        svsan_patching_preflight_vcenter_password: "{{ svsan_patching_vcenter_password }}"
        svsan_patching_preflight_vcenter_validate_certs: "{{ svsan_patching_validate_certs }}"

    # ── Phases 2-5: Maintenance, Patch, Reboot, Exit ──────────────
    - name: Patch host with maintenance mode safety
      block:
        - name: Enter ESXi maintenance mode
          tags: [svsan_maintenance]
          vmware.vmware.esxi_maintenance_mode:
            esxi_host_name: "{{ inventory_hostname }}"
            enable_maintenance_mode: true
            timeout: 600
          delegate_to: localhost

        # Option A: esxcli VIB install (direct SSH)
        - name: Apply ESXi patch via esxcli
          tags: [svsan_patch]
          ansible.builtin.command:
            cmd: >-
              esxcli software vib install
              --depot={{ svsan_patching_patch_depot }}
          register: patch_result
          changed_when: "'installed' in patch_result.stdout"
          failed_when: patch_result.rc != 0
          when: svsan_patching_method | default('esxcli') == 'esxcli'

        # Option B: VMware Lifecycle Manager (uncomment to use instead)
        # - name: Apply ESXi patch via Lifecycle Manager
        #   tags: [svsan_patch]
        #   vmware.vmware.esxi_host_remediate:
        #     esxi_host_name: "{{ inventory_hostname }}"
        #     baseline_name: "{{ svsan_patching_baseline_name }}"
        #   delegate_to: localhost
        #   when: svsan_patching_method | default('esxcli') == 'lcm'

        - name: Reboot ESXi host
          tags: [svsan_reboot]
          ansible.builtin.reboot:
            reboot_timeout: 600
          when: svsan_patching_reboot | default(true) | bool

        - name: Wait for ESXi management interface
          tags: [svsan_reboot]
          ansible.builtin.wait_for:
            host: "{{ ansible_host | default(inventory_hostname) }}"
            port: 443
            timeout: 600
            delay: 60
          delegate_to: localhost
          when: svsan_patching_reboot | default(true) | bool

        - name: Exit ESXi maintenance mode
          tags: [svsan_maintenance]
          vmware.vmware.esxi_maintenance_mode:
            esxi_host_name: "{{ inventory_hostname }}"
            enable_maintenance_mode: false
          delegate_to: localhost

      rescue:
        - name: Emergency exit maintenance mode
          vmware.vmware.esxi_maintenance_mode:
            esxi_host_name: "{{ inventory_hostname }}"
            enable_maintenance_mode: false
          delegate_to: localhost
          failed_when: false

        - name: Fail with actionable guidance
          ansible.builtin.fail:
            msg: >-
              Patching failed on {{ inventory_hostname }}.
              Maintenance mode has been released.
              Error: {{ ansible_failed_result.msg | default('unknown') }}.
              Investigate and retry with: --tags svsan_maintenance,svsan_patch,svsan_reboot,svsan_postflight

    # ── Phase 6: Post-Patching Verification ───────────────────────
    - name: Post-flight verification
      tags: [svsan_postflight]
      ansible.builtin.include_role:
        name: xianganwu.stormagic.svsan_patching_postflight
      vars:
        svsan_patching_postflight_vsa_hostname: "{{ hostvars[inventory_hostname].svsan_vsa }}"
        svsan_patching_postflight_vsa_username: "{{ svsan_patching_vsa_username }}"
        svsan_patching_postflight_vsa_password: "{{ svsan_patching_vsa_password }}"
        svsan_patching_postflight_windows_mgmt_host: "{{ svsan_patching_windows_mgmt_host }}"

    - name: Host patching complete
      tags: [svsan_postflight]
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} patched successfully.
          Pre: {{ svsan_patching_preflight_status | default('skipped') }}
          Post: {{ svsan_patching_postflight_status | default('skipped') }}
