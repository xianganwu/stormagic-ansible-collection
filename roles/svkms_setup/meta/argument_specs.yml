---
argument_specs:
  main:
    short_description: Initial setup and configuration for SvKMS
    description:
      - Creates the initial admin user on a StorMagic SvKMS server.
      - Configures default key access policies.
      - Generates a root CA certificate for the SvKMS instance.
    options:
      svkms_setup_host:
        description: SvKMS server hostname or IP address.
        type: str
        required: true
      svkms_setup_api_key:
        description: API key for SvKMS authentication.
        type: str
        required: true
        no_log: true
      svkms_setup_admin_username:
        description: Username for the initial admin account.
        type: str
        default: admin
      svkms_setup_default_policies:
        description: >-
          List of default key policies to create. Each entry must include name
          and rules (a list of rule objects accepted by svkms_policy).
        type: list
        elements: dict
        default:
          - name: default-rotation-policy
            rules:
              - effect: allow
                operations: ["encrypt", "decrypt", "rotate"]
                algorithm: AES
                min_key_length: 256
          - name: high-security-policy
            rules:
              - effect: allow
                operations: ["encrypt", "decrypt"]
                algorithm: AES
                min_key_length: 256
      svkms_setup_ca_common_name:
        description: Common name for the root CA certificate.
        type: str
        default: StorMagic SvKMS Root CA
