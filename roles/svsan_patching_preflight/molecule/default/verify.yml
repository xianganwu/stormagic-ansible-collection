---
- name: Verify — svsan_patching_preflight
  hosts: localhost
  gather_facts: false
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  tasks:
    - name: Verify role defaults file is valid
      ansible.builtin.command:
        cmd: >-
          python3 -c "import yaml;
          d = yaml.safe_load(open('defaults/main.yml'));
          assert 'svsan_patching_preflight_checks' in d;
          assert 'svsan_patching_preflight_mirror_sync_threshold' in d;
          assert 'svsan_patching_preflight_min_datastore_paths' in d;
          assert 'svsan_patching_preflight_check_esxi' in d"
        chdir: "{{ project_dir }}"
      changed_when: false

    - name: Verify argument_specs file is valid
      ansible.builtin.command:
        cmd: >-
          python3 -c "import yaml;
          d = yaml.safe_load(open('meta/argument_specs.yml'));
          assert 'argument_specs' in d;
          opts = d['argument_specs']['main']['options'];
          assert 'svsan_patching_preflight_vsa_hostname' in opts;
          assert 'svsan_patching_preflight_check_esxi' in opts;
          assert 'svsan_patching_preflight_vcenter_hostname' in opts"
        chdir: "{{ project_dir }}"
      changed_when: false
