---
- name: SvKMS key rotation
  tags: [svkms_key_rotation]
  block:
    - name: Gather key information
      xianganwu.stormagic.svkms_key_info:
        host: "{{ svkms_key_rotation_host }}"
        api_key: "{{ svkms_key_rotation_api_key }}"
        name: "{{ item }}"
      loop: "{{ svkms_key_rotation_keys }}"
      loop_control:
        label: "{{ item }}"
      register: svkms_key_rotation_info_results
      delegate_to: localhost

    - name: Fail if key not found and fail_on_missing is true
      ansible.builtin.fail:
        msg: "Key '{{ item.item }}' not found on SvKMS server"
      loop: "{{ svkms_key_rotation_info_results.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - svkms_key_rotation_fail_on_missing
        - item.key_list | length == 0

    - name: Rotate keys
      xianganwu.stormagic.svkms_key:
        host: "{{ svkms_key_rotation_host }}"
        api_key: "{{ svkms_key_rotation_api_key }}"
        name: "{{ item.item }}"
        state: rotated
      loop: "{{ svkms_key_rotation_info_results.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.key_list | length > 0
      register: svkms_key_rotation_results
      delegate_to: localhost

  rescue:
    - name: Report key rotation failure
      ansible.builtin.debug:
        msg: >-
          Key rotation failed at task '{{ ansible_failed_task.name }}'.
          Error: {{ ansible_failed_result.msg | default(ansible_failed_result) }}

    - name: Propagate failure
      ansible.builtin.fail:
        msg: "Key rotation failed — review errors above and re-run after fixing"

  always:
    - name: Report rotation results
      ansible.builtin.debug:
        msg: >-
          Key rotation {{ 'complete' if svkms_key_rotation_results is defined else 'incomplete' }}.
          {{ (svkms_key_rotation_results.results
          | selectattr('changed', 'defined')
          | selectattr('changed', 'equalto', true) | list | length) | string + ' key(s) rotated'
          if svkms_key_rotation_results is defined else 'No keys were rotated' }}
