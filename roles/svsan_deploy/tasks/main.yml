---
- name: Deploy VSA VMs from template
  community.vmware.vmware_guest:
    hostname: "{{ svsan_deploy_vcenter_hostname }}"
    username: "{{ svsan_deploy_vcenter_username }}"
    password: "{{ svsan_deploy_vcenter_password }}"
    validate_certs: false
    datacenter: "{{ svsan_deploy_vcenter_datacenter }}"
    cluster: "{{ svsan_deploy_vcenter_cluster }}"
    name: "{{ item.hostname }}"
    template: "{{ svsan_deploy_template }}"
    datastore: "{{ svsan_deploy_datastore }}"
    networks:
      - name: "{{ svsan_deploy_network }}"
        ip: "{{ item.ip_address }}"
    hardware:
      num_cpus: "{{ svsan_deploy_cpus }}"
      memory_mb: "{{ svsan_deploy_memory_mb }}"
    state: poweredon
    wait_for_ip_address: true
  loop: "{{ svsan_deploy_nodes }}"
  loop_control:
    label: "{{ item.hostname }}"
  delegate_to: localhost

- name: Wait for VSA management interface
  ansible.builtin.wait_for:
    host: "{{ item.ip_address }}"
    port: 443
    timeout: 300
  loop: "{{ svsan_deploy_nodes }}"
  loop_control:
    label: "{{ item.hostname }}"
  delegate_to: localhost

- name: Initialize VSA configuration
  stormagic.stormagic.svsan_vsa:
    vsa_hostname: "{{ item.ip_address }}"
    vsa_username: "admin"
    vsa_password: "{{ svsan_deploy_admin_password }}"
    node_id: "{{ item.node_id }}"
    state: present
  loop: "{{ svsan_deploy_nodes }}"
  loop_control:
    label: "{{ item.hostname }}"
  delegate_to: "{{ groups['windows_mgmt'][0] | default(omit) }}"

- name: Create storage pool on primary node
  stormagic.stormagic.svsan_pool:
    vsa_hostname: "{{ svsan_deploy_nodes[0].ip_address }}"
    vsa_username: "admin"
    vsa_password: "{{ svsan_deploy_admin_password }}"
    name: "{{ svsan_deploy_pool_name }}"
    size_gb: "{{ svsan_deploy_pool_size_gb }}"
    state: present
  delegate_to: "{{ groups['windows_mgmt'][0] | default(omit) }}"

- name: Report deployment completion
  ansible.builtin.debug:
    msg: "VSA cluster deployed successfully with {{ svsan_deploy_nodes | length }} nodes"
