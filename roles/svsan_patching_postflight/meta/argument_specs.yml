---
argument_specs:
  main:
    short_description: Post-patching verification for SvSAN VSA
    description:
      - Verifies SvSAN VSA health after ESXi patching.
      - Runs health checks and confirms mirror synchronization has resumed.
      - Fails the play if the VSA is unhealthy after patching.
    options:
      svsan_patching_postflight_vsa_hostname:
        description: Hostname or IP address of the SvSAN VSA to check.
        type: str
        required: true
      svsan_patching_postflight_vsa_username:
        description: Username for VSA authentication.
        type: str
        required: true
      svsan_patching_postflight_vsa_password:
        description: Password for VSA authentication.
        type: str
        required: true
        no_log: true
      svsan_patching_postflight_checks:
        description: List of health checks to run.
        type: list
        elements: str
        default:
          - connectivity
          - targets
          - mirrors
      svsan_patching_postflight_mirror_sync_threshold:
        description: Minimum mirror synchronization percentage to pass.
        type: int
        default: 100
      svsan_patching_postflight_windows_mgmt_host:
        description: >-
          Windows management host for PowerShell delegation.
          Defaults to the first host in the windows_mgmt inventory group.
        type: str
      svsan_patching_postflight_resync_wait:
        description: >-
          Wait for mirrors to resynchronize before running the health check.
          When true, polls mirror status with retries until all mirrors reach
          the sync threshold.
        type: bool
        default: true
      svsan_patching_postflight_resync_retries:
        description: Maximum number of times to poll mirror sync status.
        type: int
        default: 30
      svsan_patching_postflight_resync_delay:
        description: Seconds to wait between mirror sync polls.
        type: int
        default: 60
      svsan_patching_postflight_preflight_baseline:
        description: >-
          Preflight health baseline for degradation detection. When provided,
          the postflight role fails if health degraded compared to preflight.
          Automatically populated when using the preflight role in the same play.
        type: dict
